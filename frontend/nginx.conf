server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real file serves index.html,
    # so React Router's client-side routes (e.g. /firewall, /benchmarks)
    # work on direct navigation/refresh, not just in-app link clicks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
